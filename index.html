document.addEventListener('input',e=>{if(e.target.dataset.input==='search'){SEARCH=e.target.value;renderIssueList();}});

const SUBMIT={
  unlock:async f=>{const o=Object.fromEntries(new FormData(f));const msg=document.getElementById('unlockMsg');const btn=f.querySelector('[type=submit]');
    btn.disabled=true;btn.textContent='Unlocking…';msg.innerHTML='';
    try{const cfg=await openSealed(TEAM,o.pw);
      PREFS.initials=(o.initials||'').trim().toUpperCase();savePrefs();LOCK_MSG='';
      SYNC={owner:cfg.owner,repo:cfg.repo,path:cfg.path,token:cfg.token,team:true};lsSet(LS.sync,SYNC);
      DB=null;BASE=null;lsDel(LS.base);META={dirty:false,sha:null,lastSync:null};persist();lsDel(LS.data);
      render();await run(doPull);render();
    }catch(e){msg.innerHTML=`<div class="note-box err">${esc(e.message)}</div>`;btn.disabled=false;btn.textContent='Unlock';}},
  team:async f=>{const o=Object.fromEntries(new FormData(f));const msg=document.getElementById('teamMsg');const bad=t=>{msg.innerHTML=`<div class="note-box err">${t}</div>`;};
    if(o.pw!==o.pw2)return bad('The two passwords don’t match.');
    if(o.pw.length<10)return bad('Use at least 10 characters. Three or four random words works well.');
    const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Locking…';
    try{const sealed=await seal({owner:SYNC.owner,repo:SYNC.repo,path:SYNC.path,token:SYNC.token},o.pw);
      download(new Blob([JSON.stringify(sealed,null,1)],{type:'application/json'}),'team.json');f.reset();
      msg.innerHTML='<div class="note-box">Downloaded <b>team.json</b>. Upload it to your website repository (the public one) next to index.html, then share the site link and the password.</div>';
    }catch(e){bad(esc(e.message));}finally{btn.disabled=false;btn.textContent='Create team.json';}},
  issue:f=>{const o=Object.fromEntries(new FormData(f));let it=CTX.id?DB.issues.find(x=>x.id===CTX.id):null;const isNew=!it;
    if(isNew){it={id:DB.nextId++,uid:rid(),by:PREFS.initials||'',pm:CTX.pm||null};DB.issues.push(it);}
    Object.assign(it,{room:o.room,area:o.area||'',issue:(o.issue||'').trim(),priority:o.priority||'Normal',status:o.status||'Open',tools:(o.tools||'').trim(),buy:(o.buy||'').trim(),found:o.found||todayISO(),done:o.done||'',notes:(o.notes||'').trim()});
    if(it.status==='Done'&&!it.done)it.done=todayISO();
    if(it.status!=='Done')it.done='';
    if(isNew&&it.pm&&it.pm.q){const rec=ensurePM(it.pm.q,it.room);rec.v[it.pm.i]='!';touchPM(rec);}
    closeSheet();commit(isNew?`Issue #${it.id} added`:'Saved');},
  part:f=>{const o=Object.fromEntries(new FormData(f));let p=CTX.id?DB.parts.find(x=>x.id===CTX.id):null;const isNew=!p;
    if(isNew){p={id:DB.nextPartId++,uid:rid()};DB.parts.push(p);}
    Object.assign(p,{item:o.item.trim(),qty:o.qty.trim(),for:o.for.trim(),status:o.status||'Need',cost:o.cost.trim(),notes:o.notes.trim()});closeSheet();commit(isNew?'Part added':'Saved');},
  connect:async f=>{
    const o=Object.fromEntries(new FormData(f));const cfg={owner:o.owner.trim(),repo:o.repo.trim(),path:o.path.trim().replace(/^\/+/,''),token:o.token.trim()};
    const msg=document.getElementById('connectMsg');const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Connecting…';msg.innerHTML='';
    try{
      const res=await fetch(`${GH}/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`,{cache:'no-store',headers:ghHeaders(cfg.token)});
      if(!res.ok)throw await ghErr(res,'repo');
      const info=await res.json();
      lsSet('mt.lastOwner',cfg.owner);
      SYNC=cfg;lsSet(LS.sync,SYNC);META.sha=null;persist();
      await run(doPull);
      render();
      if(!info.private)toast('Warning: that repository is public. Make it private in GitHub settings.');else toast('Connected to GitHub');
    }catch(err){msg.innerHTML=`<div class="note-box err">${esc(err.message)}</div>`;btn.disabled=false;btn.textContent='Connect';}
  },
};
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.submit&&SUBMIT[f.dataset.submit]){e.preventDefault();SUBMIT[f.dataset.submit](f);}});

function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

/* ================= GitHub sync =================
   Data lives in a PRIVATE repo as one JSON file, read/written with the GitHub
   contents API using a fine-grained token stored only in this browser. */
const GH='https://api.github.com';
const ghHeaders=t=>({'Accept':'application/vnd.github+json','Authorization':'Bearer '+t});
const contentsURL=()=>`${GH}/repos/${encodeURIComponent(SYNC.owner)}/${encodeURIComponent(SYNC.repo)}/contents/${SYNC.path.split('/').map(encodeURIComponent).join('/')}`;
function b64enc(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);}
function b64dec(b64){const bin=atob(String(b64).replace(/\s/g,''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes);}
async function ghErr(res,what){const e=ghErrMsg(res,what,await res.json().then(j=>j.message||'',()=>''));e.status=res.status;return e;}
function ghErrMsg(res,what,m){
  if(res.status===401)return new Error('GitHub rejected the token. It may be mistyped or expired.');
  if(res.status===403&&res.headers.get('x-ratelimit-remaining')==='0')return new Error('GitHub rate limit hit. Try again in a few minutes.');
  if(res.status===403)return new Error('The token can’t write to this repository. Give it “Contents: Read and write” access.');
  if(res.status===404)return new Error(what==='repo'?'Repository not found. Check the username and repository name, and that the token includes this repository.':'File or repository not found.');
  return new Error(`GitHub error ${res.status}${m?': '+m:''}`);
}
let QUEUE=Promise.resolve(),SYNC_TIMER=null,CONFLICT_RESOLVE=null;
function run(task){QUEUE=QUEUE.then(()=>SYNC?task():null).catch(syncFail);return QUEUE;}
function signOutLocal(msg){SYNC=null;DB=null;BASE=null;META={dirty:false,sha:null,lastSync:null};LOCK_MSG=msg||'';clearTimeout(SYNC_TIMER);
  lsDel(LS.sync);lsDel(LS.data);lsDel(LS.base);lsSet(LS.meta,META);setSync('off');}
function syncFail(e){if(e&&e.status===401&&SYNC&&SYNC.team){signOutLocal('The team password has changed (or access expired). Ask for the new password.');closeSheet(true);render();return;}
  if(e instanceof TypeError)setSync('offline','No connection. Changes are saved on this device and will sync later.');else setSync('error',e.message);}
function scheduleSync(){if(!SYNC){setSync('off');return;}setSync('pending');clearTimeout(SYNC_TIMER);SYNC_TIMER=setTimeout(()=>run(doPush),2500);}
function flushSync(){if(SYNC&&META.dirty){clearTimeout(SYNC_TIMER);run(doPush);}}
const snap=d=>JSON.parse(JSON.stringify(d));
function setBase(d){BASE=snap(d);lsSet(LS.base,BASE);}
async function doPull(depth=0){
  setSync('syncing');
  const res=await fetch(contentsURL(),{cache:'no-store',headers:ghHeaders(SYNC.token)});
  if(res.status===404){if(DB){META.sha=null;return doPush(depth);}setSync('ok','No data file in the repository yet.');render();return;}
  if(!res.ok)throw await ghErr(res);
  const j=await res.json();
  if(j.sha===META.sha){if(META.dirty)return doPush(depth);markSynced();return;}
  let remote;
  if(j.content)remote=normalize(JSON.parse(b64dec(j.content)));
  else{const raw=await fetch(contentsURL(),{cache:'no-store',headers:Object.assign(ghHeaders(SYNC.token),{'Accept':'application/vnd.github.raw+json'})});if(!raw.ok)throw await ghErr(raw);remote=normalize(await raw.json());}
  if(!META.dirty||!DB){DB=remote;META.sha=j.sha;META.dirty=false;setBase(remote);markSynced();safeRender();return;}
  if(BASE){ // someone else saved while this device had changes: combine both
    DB=mergeDB(BASE,DB,remote);META.sha=j.sha;setBase(remote);persist();safeRender();return doPush(depth);}
  const choice=await askConflict(remote);
  if(choice==='remote'){DB=remote;META.sha=j.sha;META.dirty=false;setBase(remote);markSynced();render();}
  else{META.sha=j.sha;setBase(remote);return doPush(depth);}
}
async function doPush(depth=0){
  if(!DB||!SYNC)return;
  setSync('syncing');
  const stamp=DB.updated,text=JSON.stringify(DB,null,1);
  const body={message:`${PREFS.initials||'Tracker'}: update ${new Date().toLocaleString()}`,content:b64enc(text)};
  if(META.sha)body.sha=META.sha;
  const res=await fetch(contentsURL(),{method:'PUT',cache:'no-store',headers:Object.assign(ghHeaders(SYNC.token),{'Content-Type':'application/json'}),body:JSON.stringify(body)});
  if((res.status===409||res.status===422)&&depth<3)return doPull(depth+1);
  if(!res.ok)throw await ghErr(res);
  const j=await res.json();META.sha=j.content.sha;setBase(JSON.parse(text));
  if(DB.updated===stamp)META.dirty=false;
  markSynced();
  if(META.dirty)scheduleSync();
}
/* 3-way merge: base = last version both sides agreed on. Field by field, keep whichever side changed it;
   if both changed the same field, this device wins. Issues/parts are matched by uid. */
const isObj=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
function deepEq(a,b){if(a===b)return true;if(!a||!b||typeof a!=='object'||typeof b!=='object'||Array.isArray(a)!==Array.isArray(b))return false;const ka=Object.keys(a),kb=Object.keys(b);return ka.length===kb.length&&ka.every(k=>deepEq(a[k],b[k]));}
function merge3(b,l,r){
  if(deepEq(l,r))return l;if(deepEq(l,b))return r;if(deepEq(r,b))return l;
  if(isObj(l)&&isObj(r)){const bb=isObj(b)?b:{},out={};for(const k of new Set([...Object.keys(bb),...Object.keys(l),...Object.keys(r)])){const v=merge3(bb[k],l[k],r[k]);if(v!==undefined)out[k]=v;}return out;}
  return l;
}
function mergeDB(b,l,r){
  const byUid=a=>{const m={};(a||[]).forEach(x=>{m[x.uid]=x;});return m;};
  const prep=d=>Object.assign({},d,{issues:byUid(d.issues),parts:byUid(d.parts)});
  const m=snap(merge3(prep(normalize(b)),prep(l),prep(r)));
  m.issues=Object.values(m.issues||{});m.parts=Object.values(m.parts||{});
  const renumber=(list,remote)=>{const keep=new Set((remote||[]).map(x=>x.uid));list.sort((a,c)=>(keep.has(c.uid)-keep.has(a.uid))||a.id-c.id);
    const used=new Set();let max=Math.max(0,...list.map(x=>x.id));for(const x of list){if(used.has(x.id))x.id=++max;used.add(x.id);}list.sort((a,c)=>a.id-c.id);};
  renumber(m.issues,r.issues);renumber(m.parts,r.parts);
  m.nextId=Math.max(l.nextId||1,r.nextId||1);m.nextPartId=Math.max(l.nextPartId||1,r.nextPartId||1);
  return normalize(m);
}
/* don't yank the page out from under someone typing */
let PENDING_RENDER=false;
function busy(){const a=document.activeElement;return !SHEET.hidden||(a&&VIEW.contains(a)&&a.matches('input,textarea,select'));}
function safeRender(){if(busy()){PENDING_RENDER=true;return;}render();}
document.addEventListener('focusout',()=>setTimeout(()=>{if(PENDING_RENDER&&!busy()){PENDING_RENDER=false;render();}},0));
function markSynced(){META.lastSync=new Date().toISOString();persist();setSync(META.dirty?'pending':'ok');}
function askConflict(remote){return new Promise(res=>{CONFLICT_RESOLVE=res;setSync('conflict');
  openSheet('Two versions found',`<p>This device has changes that haven’t reached GitHub, and GitHub has a different version (probably from your other device).</p>
    <dl class="kv"><dt>This device</dt><dd>last change ${fmtTS(DB.updated)} · ${DB.issues.length} issues</dd><dt>GitHub</dt><dd>last change ${fmtTS(remote.updated)} · ${remote.issues.length} issues</dd></dl>
    <div class="stack" style="margin-top:16px"><button class="btn primary" data-act="conflict" data-v="local">Keep this device’s version</button><button class="btn" data-act="conflict" data-v="remote">Use GitHub’s version</button></div>
    <p class="muted small">Tip: download a backup first from Settings if you’re unsure. Every sync is also saved in the repository’s commit history.</p>`,{},true);});}
function syncText(){return ({off:'This device',pending:'Saving…',syncing:'Syncing…',ok:'Synced',offline:'Offline',error:'Sync error',conflict:'Needs you'})[SYNC_STATE.s]||'';}
function setSync(s,msg=''){SYNC_STATE={s,msg};updateSyncBadge();}
function updateSyncBadge(){const el=document.getElementById('sync');const s=SYNC?SYNC_STATE.s:'off';el.dataset.s=s;document.getElementById('syncText').textContent=SYNC?syncText():(DB?'This device only':(TEAM?'Locked':'Not set up'));el.title=SYNC_STATE.msg||'';}
document.addEventListener('visibilitychange',()=>{if(!SYNC)return;if(document.hidden)flushSync();else run(doPull);});
window.addEventListener('online',()=>{if(SYNC)run(doPull);});
window.addEventListener('pagehide',flushSync);

/* ================= Excel export ================= */
function loadScript(src){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>bad(new Error('Could not load the Excel library. Check your connection.'));document.head.appendChild(s);});}
async function exportExcel(btn){
  btn.disabled=true;const label=btn.textContent;btn.textContent='Building…';
  try{
    if(!window.XLSX)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js').catch(()=>loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'));
    const X=window.XLSX,wb=X.utils.book_new(),q=viewQ();
    const add=(name,rows,widths)=>{const ws=Array.isArray(rows[0])?X.utils.aoa_to_sheet(rows):X.utils.json_to_sheet(rows);if(widths)ws['!cols']=widths.map(w=>({wch:w}));X.utils.book_append_sheet(wb,ws,name);};
    const iss=[...DB.issues].sort((a,b)=>ordIdx(a.room)-ordIdx(b.room)||isOpen(b)-isOpen(a)||a.id-b.id);
    add('Issue Log',iss.length?iss.map(i=>({'Room':i.room,'ID':i.id,'Date Found':fmtDate(i.found,1),'Area':i.area,'Issue':i.issue,'Priority':i.priority,'Status':i.status,'Tools / Parts Needed':i.tools,'Need to Buy':i.buy,'Date Done':fmtDate(i.done,1),'Days Open':daysOpen(i),'Notes':i.notes,'Reported By':i.by||''})):[['No issues']],[8,5,11,11,48,9,15,24,20,11,9,30,11]);
    add(('Inspection '+qLabel(q)).slice(0,31),ROOMS.map(r=>{const rec=pmRec(q,r)||{};return {'Room':r,'Status':pmStateLabel[pmState(q,r)],'% Complete':pct(pmPct(q,r)),'Date Inspected':fmtDate(rec.date,1),'Inspected By':rec.by||''};}),[8,13,11,14,12]);
    const det=[['Item',...ROOMS]];CHECKLIST.forEach(([sec],s)=>{det.push([sec.toUpperCase()]);ITEMS.filter(x=>x.s===s).forEach(x=>det.push([x.label,...ROOMS.map(r=>{const v=((pmRec(q,r)||{}).v||{})[x.i]||'';return v==='!'?'Issue':v;})]));});
    add('Inspection Detail',det,[46,...ROOMS.map(()=>5)]);
    add('Projects',ROOMS.map(r=>{const p=proj(r),o={'Room':r};PROJECTS.forEach(pr=>{o[pr.label]=isDate(p[pr.k])?fmtDate(p[pr.k],1):(p[pr.k]||'');});o['Next Filter Due']=filterDue(r)?fmtDate(filterDue(r),1):'';o['Done (of 8)']=projDone(r);o['Notes']=p.notes||'';return o;}),[7,14,14,12,12,12,12,16,12,14,10,30]);
    add('Parts',DB.parts.length?DB.parts.map(p=>({'Item':p.item,'Qty':p.qty,'For (Room / Project)':p.for,'Status':p.status,'Est. Cost ($)':p.cost===''?'':(isFinite(+p.cost)?+p.cost:p.cost),'Notes':p.notes})):[['No parts']],[34,6,24,11,12,30]);
    X.writeFile(wb,`Maintenance_${todayISO()}.xlsx`);
  }catch(e){alert(e.message);}finally{btn.disabled=false;btn.textContent=label;}
}

/* ================= Team password =================
   team.json = the sync settings encrypted with AES-GCM, key from the password via PBKDF2 (600k rounds). */
const bytesToB64=u=>{let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);};
const b64ToBytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function needCrypto(){if(!(window.crypto&&crypto.subtle))throw new Error('This browser can’t do encryption here. Open the site over https.');}
async function pwKey(pw,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(obj,pw){needCrypto();const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=600000;
  const key=await pwKey(pw,salt,iter);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return {type:'maintenance-team',v:1,kdf:'PBKDF2-SHA256',iter,salt:bytesToB64(salt),iv:bytesToB64(iv),ct:bytesToB64(ct)};}
async function openSealed(t,pw){needCrypto();const key=await pwKey(pw,b64ToBytes(t.salt),t.iter||600000);let pt;
  try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(t.iv)},key,b64ToBytes(t.ct));}catch(e){throw new Error('Wrong password.');}
  return JSON.parse(new TextDecoder().decode(pt));}

/* ================= Boot ================= */
render();
fetch('team.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{TEAM=j&&j.ct?j:null;},()=>{TEAM=null;}).then(()=>{if(!DB&&!SYNC)render();else updateSyncBadge();});
if(SYNC)run(doPull);
setInterval(()=>{if(SYNC&&!document.hidden&&!META.dirty)run(doPull);},60000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
